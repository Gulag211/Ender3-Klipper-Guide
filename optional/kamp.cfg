# ============================================================
# KAMP – VOLITELNÁ KONFIGURACE
# Klipper Adaptive Meshing & Purging
# ============================================================
#
# Tento soubor je pouze doplněk k již funkční tiskárně.
# Nejdřív musí samostatně fungovat:
#
#   G28
#   BED_MESH_CALIBRATE
#
# KAMP nepoužívej jako řešení nefunkčního základního Bed Meshe.
#
# DŮLEŽITÉ:
# Samotná instalace a názvy souborů KAMP se mohou v budoucnu změnit.
# Při instalaci vždy zkontroluj aktuální README projektu KAMP.
#
# Tento soubor proto neobsahuje natvrdo cestu k instalaci, která by
# mohla být na konkrétním systému jiná.

# ------------------------------------------------------------
# EXCLUDE_OBJECT
# ------------------------------------------------------------
#
# KAMP potřebuje vědět, kde se na podložce nacházejí objekty.
# Tato sekce umožní Klipperu pracovat s informacemi o jednotlivých
# objektech v G-code.
#
# Zároveň díky ní může být možné během tisku zrušit pouze jeden
# problémový objekt a ostatní nechat pokračovat.

[exclude_object]

# POZOR:
# Nestačí pouze přidat [exclude_object].
# Slicer a Moonraker musí Klipperu skutečně předat informace
# o objektech.

# ------------------------------------------------------------
# KAMP INCLUDE
# ------------------------------------------------------------
#
# Po instalaci KAMP se obvykle přidává jeho konfigurační soubor
# pomocí [include ...].
#
# Přesný název a cestu ověř podle aktuální instalace.
#
# Příklad – ZÁMĚRNĚ ZAKOMENTOVANÝ:
#
# [include KAMP_Settings.cfg]
#
# Neodkomentovávej tento řádek, dokud daný soubor skutečně
# neexistuje na tvém Raspberry Pi.

# ------------------------------------------------------------
# PRINT_START
# ------------------------------------------------------------
#
# Základní konfigurace tohoto projektu používá:
#
#   BED_MESH_CLEAR
#   BED_MESH_CALIBRATE
#
# Jakmile KAMP spolehlivě funguje, může být klasické měření
# nahrazeno adaptivním meshem podle aktuálního výtisku.
#
# Nekopíruj ale celé cizí PRINT_START makro.
# Uprav pouze část, které rozumíš.

# ------------------------------------------------------------
# PURGE
# ------------------------------------------------------------
#
# KAMP může vytvořit adaptivní purge line.
#
# Pokud ji používáš, zkontroluj start G-code ve sliceru.
# Nechceme současně:
#
#   1. purge line ze sliceru
#   2. purge line z KAMP
#
# Purge má řídit pouze jedno místo.

# ------------------------------------------------------------
# MAX_EXTRUDE_CROSS_SECTION
# ------------------------------------------------------------
#
# Některé purge postupy mohou narazit na bezpečnostní limit
# maximálního průřezu extruze.
#
# V configu pak můžeš vidět například:
#
# [extruder]
# max_extrude_cross_section: ...
#
# Nezvyšuj tuto hodnotu naslepo jen proto, aby zmizela chyba.
# Nejdřív ověř, proč purge makro požaduje tak velkou extruzi
# a zda nastavení odpovídá trysce a použitému makru.

# ------------------------------------------------------------
# KDYŽ KAMP NEFUNGUJE
# ------------------------------------------------------------
#
# Vrať se k jednoduchému testu:
#
#   G28
#   BED_MESH_CLEAR
#   BED_MESH_CALIBRATE
#
# Pokud tento postup funguje a adaptivní mesh ne, hledej problém
# v KAMP, include souborech, datech ze sliceru nebo zpracování
# objektů – ne začínat znovu náhodně měnit BLTouch a mechaniku.
