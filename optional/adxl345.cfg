# Optional ADXL345 configuration
#
# This file is intentionally NOT included by the base printer.cfg.
# Use it only after Klipper has been configured to use the Raspberry Pi
# as a secondary MCU and the ADXL345 wiring has been verified.
#
# Do not copy GPIO/SPI settings blindly if your ADXL is connected
# differently or through another MCU/CAN toolboard.

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
# These coordinates are only a safe example near the middle of a typical
# Ender 3 bed. Adjust them so the printer can reach the point safely.
probe_points:
    115,112,20

# IMPORTANT FOR BED SLINGERS:
#
# X measurement:
#   Mount the ADXL345 firmly on the toolhead/hotend.
#
# Y measurement:
#   Move the ADXL345 to the heated bed, preferably near its centre,
#   and attach it firmly.
#
# Verify communication before every measurement:
#   ACCELEROMETER_QUERY
#
# Then measure/calibrate the appropriate axis:
#   TEST_RESONANCES AXIS=X
#   SHAPER_CALIBRATE AXIS=X
#
# Move the sensor to the bed before measuring Y:
#   TEST_RESONANCES AXIS=Y
#   SHAPER_CALIBRATE AXIS=Y
#
# Save the final calibration:
#   SAVE_CONFIG
#
# Never copy shaper frequencies from another printer.
