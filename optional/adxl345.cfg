# ============================================================
# ADXL345 – VOLITELNÁ KONFIGURACE
# ============================================================
#
# Tento soubor základní printer.cfg automaticky nepoužívá.
# Přidej ho až po zprovoznění Raspberry Pi jako druhého Klipper MCU
# a po kontrole skutečného zapojení ADXL345.
#
# GPIO/SPI nastavení nekopíruj naslepo, pokud máš ADXL připojený
# jinak, přes jiné MCU nebo například přes CAN toolboard.

[mcu rpi]
# Komunikační cesta k host MCU běžícímu na Raspberry Pi.
serial: /tmp/klipper_host_mcu

[adxl345]
# Chip-select při typickém SPI připojení přímo k Raspberry Pi.
# Ověř podle svého zapojení.
cs_pin: rpi:None

[resonance_tester]
# Bezpečný příklad měřicího bodu přibližně uprostřed Enderu 3.
# Souřadnice uprav podle skutečného rozsahu své tiskárny.
probe_points:
    115,112,20

# ------------------------------------------------------------
# BED SLINGER – DŮLEŽITÉ UMÍSTĚNÍ SENZORU
# ------------------------------------------------------------
#
# OSA X:
# ADXL upevni PEVNĚ na toolhead/hotend.
#
# OSA Y:
# ADXL přesuň PEVNĚ na vyhřívanou podložku, ideálně přibližně
# do jejího středu.
#
# Volně položený nebo měkce přichycený senzor může měření zkreslit.
# Zkontroluj také kabel – nesmí tahat za senzor ani se zachytit.
#
# Kontrola komunikace:
#   ACCELEROMETER_QUERY
#
# X:
#   TEST_RESONANCES AXIS=X
#   SHAPER_CALIBRATE AXIS=X
#
# Potom přesuň senzor na bed.
#
# Y:
#   TEST_RESONANCES AXIS=Y
#   SHAPER_CALIBRATE AXIS=Y
#
# Uložení výsledků:
#   SAVE_CONFIG
#
# Frekvence ani typ shaperu nikdy nekopíruj z jiné tiskárny.
