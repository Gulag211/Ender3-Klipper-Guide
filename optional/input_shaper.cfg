# Optional Input Shaper configuration
#
# This file is intentionally NOT included by the base printer.cfg.
# Add it only after measuring YOUR printer.
#
# Do not copy example frequencies or shaper types from another machine.
# Even two Ender 3 printers with similar modifications can resonate
# differently.

[input_shaper]

# Fill these values with the results of your own calibration.
#
# Example structure only:
#
# shaper_type_x: mzv
# shaper_freq_x: YOUR_MEASURED_X_FREQUENCY
#
# shaper_type_y: mzv
# shaper_freq_y: YOUR_MEASURED_Y_FREQUENCY
#
# IMPORTANT:
# "mzv" above is only a syntax example, not a recommendation.
# Use the shaper type selected from your own measurement.

# Recommended workflow:
#
# 1. Verify ADXL communication:
#      ACCELEROMETER_QUERY
#
# 2. Bed slinger - measure X with the sensor firmly mounted
#    on the toolhead:
#      SHAPER_CALIBRATE AXIS=X
#
# 3. Move the ADXL firmly to the heated bed, preferably near
#    its centre, and measure Y:
#      SHAPER_CALIBRATE AXIS=Y
#
# 4. Review the values reported by Klipper.
#
# 5. Save the calibration:
#      SAVE_CONFIG
#
# NOTE:
# SHAPER_CALIBRATE + SAVE_CONFIG can write the selected Input Shaper
# values into the SAVE_CONFIG section of printer.cfg. In that case you
# do not need to duplicate the same active values in this file.
#
# This template mainly exists to show what an isolated manual
# Input Shaper configuration looks like.
#
# Re-measure after significant mechanical changes such as:
# - different toolhead/extruder/hotend,
# - major bed changes,
# - changed belt tension,
# - changes to motion hardware.
