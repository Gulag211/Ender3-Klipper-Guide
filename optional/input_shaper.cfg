# ============================================================
# INPUT SHAPER – VOLITELNÁ ŠABLONA
# ============================================================
#
# Tento soubor základní printer.cfg automaticky nepoužívá.
# Input Shaper nastav až podle měření TVÉ tiskárny.
#
# I dvě podobně upravené tiskárny Ender 3 mohou mít jiné rezonance.

[input_shaper]

# ------------------------------------------------------------
# JAK VYPADÁ RUČNÍ ZÁPIS
# ------------------------------------------------------------
#
# Pouze ukázka syntaxe – následující řádky jsou zakomentované:
#
# shaper_type_x: mzv
# shaper_freq_x: TVOJE_NAMERENA_FREKVENCE_X
#
# shaper_type_y: mzv
# shaper_freq_y: TVOJE_NAMERENA_FREKVENCE_Y
#
# POZOR:
# Ani "mzv" zde není doporučená hodnota. Je to jen ukázka zápisu.
# Použij typ shaperu a frekvenci určené z vlastního měření.

# ------------------------------------------------------------
# DOPORUČENÝ POSTUP
# ------------------------------------------------------------
#
# 1. Ověř ADXL:
#      ACCELEROMETER_QUERY
#
# 2. Bed slinger – X měř s ADXL pevně na toolheadu:
#      SHAPER_CALIBRATE AXIS=X
#
# 3. Přesuň ADXL pevně na bed, ideálně přibližně do středu:
#      SHAPER_CALIBRATE AXIS=Y
#
# 4. Zkontroluj výsledky, které Klipper vypíše.
#
# 5. Ulož kalibraci:
#      SAVE_CONFIG
#
# SHAPER_CALIBRATE + SAVE_CONFIG může výsledné hodnoty zapsat
# do automatické SAVE_CONFIG části printer.cfg.
# V takovém případě stejné aktivní hodnoty neduplikuj ještě sem.
#
# Tato šablona hlavně ukazuje, jak by oddělený ruční config vypadal.
#
# Měření zopakuj po významné změně mechaniky, například:
# - jiný toolhead / extruder / hotend,
# - významná změna bedu,
# - změna napnutí řemenů,
# - změna vedení nebo jiné části pohybové soustavy.
