# ============================================================
# UŽITEČNÁ MAKRA – VOLITELNÝ SOUBOR
# ============================================================
#
# Tento soubor není nutný pro první zprovoznění tiskárny.
# Základní PRINT_START a PRINT_END jsou přímo v printer.cfg.
#
# Pokud chceš používat tato makra, přidej do printer.cfg:
#
#   [include macros.cfg]
#
# a soubor macros.cfg ulož do stejné složky jako printer.cfg.
#
# Začínáme schválně jen několika jednoduchými makry.
# Každé makro by mělo mít jasný účel a mělo by být snadné pochopit.

#####################################################################
# LOAD_FILAMENT – ZAVEDENÍ FILAMENTU
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Zavede filament do hotendu
gcode:
    # Extruder musí být dostatečně zahřátý.
    # Klipper jinak pohyb extruderu z bezpečnostních důvodů odmítne.
    {% if printer.extruder.can_extrude|lower == 'true' %}

        # M83 = relativní režim extruze.
        M83

        # Delší pomalý posun filamentu směrem k trysce.
        G1 E50 F300

        # Kratší pomalé protlačení materiálu tryskou.
        G1 E10 F120

        # Vynulování souřadnice extruderu.
        G92 E0

    {% else %}

        # M117 zobrazí zprávu v podporovaném rozhraní/displeji.
        M117 Nejdrive zahrat hotend!

    {% endif %}

#####################################################################
# UNLOAD_FILAMENT – VYTAŽENÍ FILAMENTU
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Vytahne filament z extruderu
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}

        M83

        # Nejdřív malé protlačení dopředu.
        # Může pomoci vytvarovat konec filamentu před vytažením.
        G1 E5 F180

        # Rychlá počáteční retrakce z horké zóny.
        G1 E-15 F1200

        # Potom delší vytažení filamentu.
        # Délku uprav podle konkrétního extruderu/Bowdenu.
        G1 E-70 F600

        G92 E0

    {% else %}

        M117 Nejdrive zahrat hotend!

    {% endif %}

#####################################################################
# PARK_HEAD – JEDNODUCHÉ ZAPARKOVÁNÍ HLAVY
#####################################################################

[gcode_macro PARK_HEAD]
description: Zvedne Z a zaparkuje hlavu
gcode:
    # Parkování má smysl pouze po homingu os.
    # "xyz" v homed_axes znamená, že jsou všechny tři osy zahomované.
    {% if "xyz" in printer.toolhead.homed_axes %}

        # Zvedni Z pouze tehdy, pokud je nad aktuální polohou ještě
        # alespoň 10 mm prostoru.
        {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 10) %}
            G91
            G1 Z10 F1200
            G90
        {% endif %}

        # Parkovací poloha vychází z našeho základního Ender 3 configu.
        # Pokud má tvoje tiskárna jiný bezpečný rozsah, uprav ji.
        G1 X0 Y200 F6000

    {% else %}

        M117 Nejdrive proved G28!

    {% endif %}

#####################################################################
# PREHEAT_PLA – JEDNODUCHÝ PŘEDEHŘEV
#####################################################################

[gcode_macro PREHEAT_PLA]
description: Predehreje hotend a bed pro PLA
gcode:
    # M140/M104 pouze nastaví teplotu – makro na její dosažení nečeká.
    # Hodnoty jsou jen běžný výchozí příklad, ne univerzální recept.
    M140 S60
    M104 S200

#####################################################################
# CO SEM ZÁMĚRNĚ NEDÁVÁME
#####################################################################
#
# M300 / BEEPER
# -------------
# Některé starší configy obsahují makro M300 pro pípák.
# Nedáváme ho do základu, protože závisí na konkrétním displeji,
# zapojení a definovaném výstupním pinu. Makro odkazující na
# neexistující BEEPER_pin by pouze způsobovalo chyby.
#
# Složitá PAUSE/RESUME/CANCEL makra
# ---------------------------------
# Mainsail/Klipper už pro tyto funkce poskytuje standardní mechanismy.
# Nechceme začátečníkovi bez důvodu přepisovat jejich chování.
#
# KAMP makra
# ----------
# Patří do volitelné KAMP konfigurace, ne do základních maker.
#
# Automatické SAVE_CONFIG
# -----------------------
# Kalibrační hodnoty ukládej vědomě. Makro by nemělo začátečníkovi
# bez vysvětlení automaticky přepisovat konfiguraci.
