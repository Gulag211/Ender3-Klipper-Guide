# Ender 3 + BTT SKR Mini E3 V3.0
# Beginner base configuration for:
# https://github.com/Gulag211/Ender3-Klipper-Guide
#
# IMPORTANT:
# This is a STARTING POINT, not a universal ready-to-print configuration.
# Read README.md and the comments marked CHANGE/CHECK before using it.
#
# Firmware for SKR Mini E3 V3.0:
#   MCU: STM32G0B1
#   Bootloader: 8KiB bootloader
#   Communication: USB

[include mainsail.cfg]

#####################################################################
# MCU
#####################################################################

[mcu]
# CHANGE: Run: ls /dev/serial/by-id/*
# Then replace the example below with YOUR board ID.
serial: /dev/serial/by-id/CHANGE_ME

#####################################################################
# X axis
#####################################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 230
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.8
stealthchop_threshold: 999999
diag_pin: ^PC0
# CHECK/CALIBRATE: Sensorless homing sensitivity is printer-specific.
driver_sgthrs: 100

#####################################################################
# Y axis
#####################################################################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 225
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.8
stealthchop_threshold: 999999
diag_pin: ^PC1
# CHECK/CALIBRATE: Sensorless homing sensitivity is printer-specific.
driver_sgthrs: 100

#####################################################################
# Z axis
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -2
# First BLTouch/Z-home tests: keep this deliberately slow.
# After the probe is safely verified, you can increase it to 5-16 mm/s.
homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.6
stealthchop_threshold: 999999

#####################################################################
# Extruder
#####################################################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16

# CHECK: This example assumes a 3:1 geared extruder.
# Remove/comment gear_ratio if your extruder does not use this ratio.
gear_ratio: 3:1

# CALIBRATE this value for your own extruder.
rotation_distance: 22.28

nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200.0

heater_pin: PC8
# CHECK: Verify that this sensor type matches your hotend thermistor.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 5
max_temp: 280

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.4
stealthchop_threshold: 999999

#####################################################################
# BLTouch
#####################################################################

[bltouch]
sensor_pin: ^PC2
control_pin: PA1
# MEASURE: Probe offsets depend on your BLTouch mount.
x_offset: 30
y_offset: 2
# Do not copy someone else's Z offset.
# Klipper will save your calibrated z_offset using SAVE_CONFIG.
pin_move_time: 0.1
speed: 25
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False

[safe_z_home]
# CHECK: The PROBE, not necessarily the nozzle, should be over a safe
# part of the bed when Z homes.
home_xy_position: 115,112
speed: 50
z_hop: 10
z_hop_speed: 20

#####################################################################
# Bed mesh
#####################################################################

[bed_mesh]
speed: 150
horizontal_move_z: 7
# CHECK: These coordinates must keep YOUR probe over the bed.
mesh_min: 35,10
mesh_max: 220,220
probe_count: 3,3

#####################################################################
# Heated bed
#####################################################################

[heater_bed]
heater_pin: PC9
# CHECK: Verify the thermistor fitted to your bed.
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 5
max_temp: 125

#####################################################################
# Fans
#####################################################################

[fan]
pin: PC7

[heater_fan hotend_fan]
pin: PC6
heater: extruder
heater_temp: 50.0

[temperature_fan mobo_fan]
pin: PB15
sensor_type: temperature_mcu
max_temp: 50
min_temp: 5
target_temp: 30
control: watermark

#####################################################################
# Raspberry Pi temperature
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#####################################################################
# Printer limits
#####################################################################

[printer]
kinematics: cartesian
# Start conservatively. Raise speeds/acceleration only after the
# printer is mechanically sound and calibrated.
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 100

#####################################################################
# Optional 12864 display
#####################################################################

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

#####################################################################
# Basic start/end macros
#####################################################################

[gcode_macro PRINT_START]
description: Basic start macro without KAMP
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    M140 S{BED_TEMP}
    M104 S150
    M190 S{BED_TEMP}
    M109 S150

    G90
    M83
    G28

    # Basic full-bed mesh. KAMP will be added later as an optional feature.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    M104 S{EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP}
    G92 E0

[gcode_macro PRINT_END]
description: Basic safe end macro
gcode:
    M400
    G92 E0
    G1 E-1.0 F1800
    TURN_OFF_HEATERS
    M107

    # Lift Z only if there is room to do so.
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 10) %}
        G91
        G1 Z10 F1200
        G90
    {% endif %}

    G1 X0 Y200 F6000
    M84
    BED_MESH_CLEAR

# Advanced features intentionally NOT included in this base file:
# - KAMP
# - ADXL345 / Raspberry Pi secondary MCU
# - Input Shaper values
# - Pressure Advance
# - firmware retraction
#
# Add and calibrate them only after the base printer works correctly.
