# Ender 3 + BTT SKR Mini E3 V3.0
# Výukový základ konfigurace pro:
# https://github.com/Gulag211/Ender3-Klipper-Guide
#
# DŮLEŽITÉ:
# Toto je VÝCHOZÍ BOD, ne univerzální hotový config pro každý Ender 3.
# Před použitím projdi README a jednotlivé kapitoly v adresáři guides/.
#
# Klipper používá pro komentáře znak #.
# ! před pinem = invertovaná logika. U dir_pin tím prakticky obrátíš směr motoru.
# ^ před vstupním pinem = zapnutí interního pull-up rezistoru.
#
# Firmware SKR Mini E3 V3.0:
# MCU: STM32G0B1 | bootloader: 8 KiB | komunikace: USB

[include mainsail.cfg]

#####################################################################
# MCU – HLAVNÍ DESKA
#####################################################################

[mcu]
# Zjisti vlastní ID příkazem:
# ls /dev/serial/by-id/*
# CHANGE_ME nahraď skutečným ID své desky.
serial: /dev/serial/by-id/CHANGE_ME

#####################################################################
# OSA X + SENSORLESS HOMING
#####################################################################

[stepper_x]
step_pin: PB13
# ! obrací logiku DIR a tím směr otáčení motoru.
dir_pin: !PB12
# ! zde znamená, že driver je povolen logickou nulou.
enable_pin: !PB14
# 16 mikrokroků na jeden plný krok motoru.
microsteps: 16
# Lineární pohyb osy v mm na jednu otáčku motoru.
rotation_distance: 40
# Virtuální endstop z DIAG signálu TMC2209 – bez mechanického spínače.
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
# Ověř podle skutečného bezpečného rozsahu své tiskárny.
position_max: 230
homing_speed: 50
# U sensorless homingu nechceme klasický druhý nájezd na spínač.
homing_retract_dist: 0

[tmc2209 stepper_x]
# UART umožňuje Klipperu nastavovat a číst driver TMC2209.
uart_pin: PC11
tx_pin: PC10
uart_address: 0
# Proud motoru – neber jako univerzální hodnotu pro každý motor.
run_current: 0.8
# Vysoká hodnota zde prakticky ponechává StealthChop aktivní.
stealthchop_threshold: 999999
# ^ zapíná interní pull-up pro DIAG vstup.
diag_pin: ^PC0
# Citlivost StallGuard pro sensorless homing. MUSÍŠ otestovat na své mechanice.
# Vyšší hodnota = citlivější detekce nárazu, nižší = méně citlivá.
driver_sgthrs: 100

#####################################################################
# OSA Y + SENSORLESS HOMING
#####################################################################

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 225
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.8
stealthchop_threshold: 999999
diag_pin: ^PC1
# X a Y nemusí mít stejnou správnou citlivost.
driver_sgthrs: 100

#####################################################################
# OSA Z – BLTOUCH JAKO VIRTUÁLNÍ ENDSTOP
#####################################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
# U běžného Enderu se Z šroubem T8x8 odpovídá jedna otáčka 8 mm pohybu.
# Pokud máš jiný šroub/převod, ověř tuto hodnotu.
rotation_distance: 8
# Z-home se ukončí sepnutím sondy.
endstop_pin: probe:z_virtual_endstop
position_max: 250
# Malá záporná rezerva je užitečná při kalibraci Z-offsetu.
position_min: -2
# PRVNÍ test BLTouch necháváme úmyslně velmi pomalý.
# Po bezpečném ověření můžeš zvýšit například na 5–16 mm/s.
homing_speed: 2

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.6
stealthchop_threshold: 999999

#####################################################################
# EXTRUDER + HOTEND
#####################################################################

[extruder]
step_pin: PB3
# Pokud extruder podává filament opačně, mění se zde přítomnost !.
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16

# Tento příklad počítá s převodovaným extruderem 3:1.
# Máš-li jiný převod nebo přímý pohon, nastav podle skutečné mechaniky.
gear_ratio: 3:1

# TUTO HODNOTU ZKALIBRUJ podle kapitoly 05.
rotation_distance: 22.28

nozzle_diameter: 0.400
filament_diameter: 1.750
# Umožní samostatný delší pohyb extruderu například při kalibraci.
max_extrude_only_distance: 200.0

heater_pin: PC8
# Ověř skutečný typ termistoru svého hotendu.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
# Bezpečnostní teplotní meze – nemají sloužit k obcházení chyb senzoru.
min_temp: 5
max_temp: 280

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.4
stealthchop_threshold: 999999

#####################################################################
# BLTOUCH / KOMPATIBILNÍ SONDA
#####################################################################

[bltouch]
# ^ = interní pull-up vstupu sondy.
sensor_pin: ^PC2
# Servo/řídicí signál pro vysunutí a zasunutí pinu.
control_pin: PA1
# Poloha sondy vůči trysce – ZMĚŘ na svém držáku.
x_offset: 30
y_offset: 2
# z_offset sem nekopíruj z cizí tiskárny.
# Zkalibruj ho pomocí PROBE_CALIBRATE; SAVE_CONFIG jej uloží.
pin_move_time: 0.1
speed: 25
# Následující volby mohou záviset na typu/revizi sondy.
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False

[safe_z_home]
# Souřadnice trysky při Z-home musí umístit SONDU bezpečně nad bed.
home_xy_position: 115,112
# Rychlost XY přesunu do místa Z-home.
speed: 50
# Před/po homingu zvedne Z o bezpečnou vzdálenost.
z_hop: 10
z_hop_speed: 20

#####################################################################
# BED MESH
#####################################################################

[bed_mesh]
# Rychlost přesunu mezi měřicími body.
speed: 150
# Výška Z při vodorovných přejezdech mezi body.
horizontal_move_z: 7
# Souřadnice oblasti měřené SONDOU, ne jen rozměr podložky.
# Ověř s ohledem na x_offset/y_offset a fyzické limity.
mesh_min: 35,10
mesh_max: 220,220
# 3 × 3 = 9 měřicích bodů. Pro první zprovoznění jednoduchý základ.
probe_count: 3,3

#####################################################################
# VYHŘÍVANÁ PODLOŽKA
#####################################################################

[heater_bed]
heater_pin: PC9
# Ověř skutečný termistor na své podložce.
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 5
max_temp: 125

#####################################################################
# VENTILÁTORY
#####################################################################

# Ofuk výtisku – typicky řízený slicerem pomocí M106/M107.
[fan]
pin: PC7

# Ventilátor hotendu se automaticky zapne po překročení 50 °C.
[heater_fan hotend_fan]
pin: PC6
heater: extruder
heater_temp: 50.0

# Ventilátor elektroniky podle teploty MCU.
[temperature_fan mobo_fan]
pin: PB15
sensor_type: temperature_mcu
max_temp: 50
min_temp: 5
target_temp: 30
control: watermark

#####################################################################
# TEPLOTA RASPBERRY PI
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

#####################################################################
# ZÁKLADNÍ LIMITY TISKÁRNY
#####################################################################

[printer]
kinematics: cartesian
# Začínáme konzervativně. Zvyšuj až po mechanické kontrole a kalibraci.
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 100

#####################################################################
# VOLITELNÝ 12864 DISPLEJ
#####################################################################

[board_pins]
# Aliasy fyzických pinů konektoru EXP1 usnadní konfiguraci displeje.
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
# ^ = pull-up na vstupu enkodéru.
encoder_pins: ^EXP1_5, ^EXP1_3
# ^ = pull-up, ! = obrácená logika tlačítka.
click_pin: ^!EXP1_2

#####################################################################
# PRINT_START – ZÁKLAD BEZ KAMP
#####################################################################

[gcode_macro PRINT_START]
description: Zakladni start tisku bez KAMP
gcode:
    # Teploty předá slicer. Když je nepředá, použijí se 60/200 °C.
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # M140/M104 nastaví teplotu bez čekání.
    M140 S{BED_TEMP}
    M104 S150
    # M190/M109 čekají na dosažení teploty.
    M190 S{BED_TEMP}
    M109 S150

    # Absolutní souřadnice os, relativní extruze.
    G90
    M83
    G28

    # Základní celý mesh. KAMP je až volitelné rozšíření.
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # Teprve po meshi nahřej hotend na finální tiskovou teplotu.
    M104 S{EXTRUDER_TEMP}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP}
    # Vynulování souřadnice extruderu před tiskem.
    G92 E0

#####################################################################
# PRINT_END – BEZPEČNÉ UKONČENÍ TISKU
#####################################################################

[gcode_macro PRINT_END]
description: Zakladni bezpecne ukonceni tisku
gcode:
    # Počkej na dokončení všech naplánovaných pohybů.
    M400
    G92 E0
    # Malá retrakce pro snížení tlaku v trysce.
    G1 E-1.0 F1800
    # Vypnutí topení a ofuku výtisku.
    TURN_OFF_HEATERS
    M107

    # Zvedni Z o 10 mm pouze tehdy, pokud na to zbývá prostor.
    {% if printer.toolhead.position.z < (printer.toolhead.axis_maximum.z - 10) %}
        G91
        G1 Z10 F1200
        G90
    {% endif %}

    # Parkovací poloha – ověř podle skutečných limitů své tiskárny.
    G1 X0 Y200 F6000
    # Vypnutí krokových motorů.
    M84
    # Další tisk si vytvoří nový mesh.
    BED_MESH_CLEAR

#####################################################################
# CO V ZÁKLADNÍM CONFIGU ÚMYSLNĚ NENÍ
#####################################################################
#
# - KAMP
# - ADXL345 / Raspberry Pi jako druhé MCU
# - konkrétní Input Shaper hodnoty
# - Pressure Advance
# - firmware retraction
#
# Tyto funkce přidávej až po spolehlivém zprovoznění základu.
